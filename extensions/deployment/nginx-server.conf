# Included inside the upstream server block. Protected media must never be public.
    # Direct-IP HTTP must never silently run the multi-account game without
    # secure media cookies. Preserve path and query on the canonical host.
    if ($host = 132.145.25.168) {
        return 308 https://tadazz.com$request_uri;
    }

    # Always re-fetch the SPA shell, including internal deep-link fallbacks.
    # Fingerprinted assets can keep their own browser cache entries.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Every media request is authorized by the app; no public tenant file alias.
    location /media/ {
        proxy_pass http://127.0.0.1:3001/api/media/raw/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
    location /__private_media/ {
        internal;
        alias /app/config/tenants/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "private, no-store";
    }
    location /__legacy_media/ {
        internal;
        alias /app/config/media/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "private, no-store";
    }

