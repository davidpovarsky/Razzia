# Opt-in server-block include. Declare an HTTP-context upstream named
# tadazz_native_mcp pointing at the reviewed native host (normally127.0.0.1:3001).
# This file is deliberately not included by the existing production config.
location ~ "^/(?:mcp(?:/|$)|oauth(?:/|$)|\.well-known(?:/|$)|studio/(?:oauth-consent(?:/|$)|native-save-consent(?:/|$)))" {
    # No URI suffix: preserve the original request target for strict raw routing.
    proxy_pass http://tadazz_native_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header Upgrade "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Server "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Uri "";
    proxy_set_header X-Forwarded-Scheme "";
    # Leave Authorization and Origin intact. The service owns their validation.
    # Unknown forwarded headers remain a service-level fail-closed rejection.
    client_max_body_size 64k;
    client_body_timeout 5s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;
}
