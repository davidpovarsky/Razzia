<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TADAZZ Question Background Animation</title>
  <style>
    :root {
      --w: 1920;
      --h: 1080;
      --beam-blue: rgba(80, 190, 255, 0.32);
      --beam-violet: rgba(185, 100, 255, 0.32);
      --beam-magenta: rgba(255, 95, 216, 0.22);
      --glow-gold: rgba(255, 196, 74, 0.22);
      --glow-blue: rgba(52, 180, 255, 0.16);
      --glow-violet: rgba(184, 91, 255, 0.18);
      --glow-lime: rgba(226, 255, 28, 0.14);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #090119;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .stage-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #090119;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #120024;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
    }

    .fx, .fx2, .ui-demo, canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .soft-pulse {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(208, 75, 255, 0.14), transparent 28%),
        radial-gradient(ellipse at 50% 72%, rgba(255, 190, 70, 0.10), transparent 24%),
        radial-gradient(ellipse at 18% 28%, rgba(56, 180, 255, 0.08), transparent 22%),
        radial-gradient(ellipse at 84% 32%, rgba(223, 255, 65, 0.08), transparent 22%);
      mix-blend-mode: screen;
      animation: breathe 8s ease-in-out infinite;
    }

    .beam {
      position: absolute;
      width: 18%;
      height: 70%;
      top: -4%;
      transform-origin: 50% 0%;
      filter: blur(6px);
      opacity: .55;
      mix-blend-mode: screen;
      background: linear-gradient(to bottom,
        rgba(255,255,255,0.0) 0%,
        rgba(255,255,255,0.15) 8%,
        var(--beam-violet) 22%,
        rgba(255,255,255,0.0) 100%);
      clip-path: polygon(42% 0%, 58% 0%, 78% 100%, 22% 100%);
    }

    .beam.b1 { left: 20%; animation: sweep1 10s ease-in-out infinite; }
    .beam.b2 {
      left: 37%;
      height: 74%;
      background: linear-gradient(to bottom,
        rgba(255,255,255,0.0) 0%,
        rgba(255,255,255,0.12) 8%,
        var(--beam-blue) 24%,
        rgba(255,255,255,0.0) 100%);
      animation: sweep2 13s ease-in-out infinite;
    }
    .beam.b3 {
      left: 59%;
      width: 20%;
      background: linear-gradient(to bottom,
        rgba(255,255,255,0.0) 0%,
        rgba(255,255,255,0.12) 8%,
        var(--beam-violet) 20%,
        rgba(255,255,255,0.0) 100%);
      animation: sweep3 11s ease-in-out infinite;
    }
    .beam.b4 {
      left: 72%;
      width: 18%;
      background: linear-gradient(to bottom,
        rgba(255,255,255,0.0) 0%,
        rgba(255,255,255,0.10) 8%,
        var(--beam-magenta) 22%,
        rgba(255,255,255,0.0) 100%);
      animation: sweep4 14s ease-in-out infinite;
    }

    .edge-glow {
      position: absolute;
      inset: 0;
      mix-blend-mode: screen;
      opacity: .8;
    }
    .edge-glow.left {
      background: radial-gradient(circle at 14% 50%, rgba(55, 184, 255, 0.17), transparent 14%);
      animation: pulseLeft 7.2s ease-in-out infinite;
    }
    .edge-glow.right {
      background: radial-gradient(circle at 87% 49%, rgba(223, 255, 53, 0.18), transparent 15%);
      animation: pulseRight 7.6s ease-in-out infinite;
    }

    .glint {
      position: absolute;
      width: 18%;
      height: 2.8%;
      border-radius: 999px;
      filter: blur(3px);
      opacity: 0;
      mix-blend-mode: screen;
      background: linear-gradient(90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,0.95),
        rgba(255,255,255,0));
    }

    .glint.left {
      left: 8%; top: 28%;
      transform: rotate(-26deg);
      animation: glintLeft 5.8s linear infinite;
    }
    .glint.right {
      right: 7%; top: 29%;
      width: 20%;
      transform: rotate(-24deg);
      animation: glintRight 6.4s linear infinite 1.2s;
    }

    .floor-shimmer {
      position: absolute;
      left: -10%; right: -10%; bottom: 0%;
      height: 26%;
      background:
        linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0) 48%, rgba(146,75,255,0.11) 58%, rgba(255,203,58,0.08) 74%, rgba(255,255,255,0) 100%),
        linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0) 100%);
      background-size: 100% 100%, 34% 100%;
      background-repeat: no-repeat, no-repeat;
      background-position: center center, -30% center;
      mix-blend-mode: screen;
      opacity: .9;
      animation: floorTravel 8.5s ease-in-out infinite;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0) 42%, rgba(0,0,0,0.18) 100%);
    }

    .bulb-shimmer {
      position: absolute;
      top: 4%; left: 16%; right: 16%; height: 16%;
      background: radial-gradient(circle at 50% 52%, rgba(255, 213, 92, 0.10), transparent 44%);
      filter: blur(16px);
      opacity: .6;
      mix-blend-mode: screen;
      animation: bulbs 4.6s ease-in-out infinite;
    }

    .ui-demo {
      display: none;
      padding: 3.4% 4.2% 4.4%;
    }

    .ui-demo.active { display: block; }

    .q-top {
      position: absolute;
      top: 5%; left: 6%; right: 6%;
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 18px rgba(0,0,0,.55);
    }
    .q-label {
      font-size: clamp(12px, 1.0vw, 22px);
      letter-spacing: .26em;
      font-weight: 700;
      opacity: .8;
      margin-bottom: .7rem;
    }
    .q-title {
      font-size: clamp(28px, 2.5vw, 56px);
      font-weight: 800;
      line-height: 1.12;
      max-width: 70%;
      margin: 0 auto;
    }
    .cards {
      position: absolute;
      left: 5%; right: 5%; bottom: 9%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.25%;
      height: 37%;
    }
    .card {
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 18px 44px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.15);
      backdrop-filter: blur(3px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .thumb {
      flex: 1;
      background:
        linear-gradient(140deg, rgba(255,255,255,.28), rgba(255,255,255,.05)),
        radial-gradient(circle at 30% 30%, rgba(50, 190, 255, .4), transparent 30%),
        radial-gradient(circle at 70% 40%, rgba(226,255,24,.45), transparent 30%),
        linear-gradient(160deg, rgba(255, 120, 228, .5), rgba(32, 18, 79, .6));
      position: relative;
    }
    .thumb::after {
      content: '';
      position: absolute;
      inset: 18% 14%;
      border-radius: 20px;
      border: 2px dashed rgba(255,255,255,.28);
    }
    .card-label {
      padding: 10px 12px 14px;
      color: white;
      font-size: clamp(14px, 1.0vw, 20px);
      font-weight: 700;
      letter-spacing: .05em;
      text-align: center;
    }

    .controls {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 9999;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(10, 8, 28, 0.72);
      color: #fff;
      box-shadow: 0 12px 28px rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
      font-size: 14px;
    }
    .controls input { width: 130px; }
    .controls button {
      background: linear-gradient(180deg, #994bff, #6a1fff);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    @keyframes breathe {
      0%, 100% { opacity: .70; }
      50% { opacity: 1; }
    }
    @keyframes sweep1 {
      0%,100% { transform: translateX(0) rotate(-8deg); opacity: .26; }
      50% { transform: translateX(1.5%) rotate(-14deg); opacity: .48; }
    }
    @keyframes sweep2 {
      0%,100% { transform: translateX(0) rotate(2deg); opacity: .18; }
      50% { transform: translateX(-1.2%) rotate(-3deg); opacity: .36; }
    }
    @keyframes sweep3 {
      0%,100% { transform: translateX(0) rotate(9deg); opacity: .24; }
      50% { transform: translateX(1.3%) rotate(14deg); opacity: .48; }
    }
    @keyframes sweep4 {
      0%,100% { transform: translateX(0) rotate(13deg); opacity: .15; }
      50% { transform: translateX(-1.4%) rotate(18deg); opacity: .30; }
    }
    @keyframes pulseLeft {
      0%,100% { opacity: .35; }
      50% { opacity: .82; }
    }
    @keyframes pulseRight {
      0%,100% { opacity: .40; }
      50% { opacity: .88; }
    }
    @keyframes glintLeft {
      0%, 20% { opacity: 0; transform: translate(-5%, -1%) rotate(-26deg) scaleX(.82); }
      28% { opacity: .96; }
      40% { opacity: 0; transform: translate(19%, 6%) rotate(-26deg) scaleX(1.08); }
      100% { opacity: 0; transform: translate(19%, 6%) rotate(-26deg) scaleX(1.08); }
    }
    @keyframes glintRight {
      0%, 22% { opacity: 0; transform: translate(5%, -2%) rotate(-24deg) scaleX(.82); }
      30% { opacity: .96; }
      44% { opacity: 0; transform: translate(-18%, 6%) rotate(-24deg) scaleX(1.08); }
      100% { opacity: 0; transform: translate(-18%, 6%) rotate(-24deg) scaleX(1.08); }
    }
    @keyframes floorTravel {
      0%,100% { background-position: center center, -26% center; opacity: .40; }
      50% { background-position: center center, 118% center; opacity: .72; }
    }
    @keyframes bulbs {
      0%,100% { opacity: .22; transform: scaleX(.99); }
      50% { opacity: .48; transform: scaleX(1.01); }
    }
  </style>
</head>
<body>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <img class="bg" src="background.png" alt="Tadazz question background" />

      <div class="fx" id="fxRoot" style="opacity:1">
        <div class="soft-pulse"></div>
        <div class="beam b1"></div>
        <div class="beam b2"></div>
        <div class="beam b3"></div>
        <div class="beam b4"></div>
        <div class="edge-glow left"></div>
        <div class="edge-glow right"></div>
        <div class="glint left"></div>
        <div class="glint right"></div>
        <canvas id="particleCanvas"></canvas>
        <div class="floor-shimmer"></div>
        <div class="bulb-shimmer"></div>
        <div class="vignette"></div>
      </div>

      <div class="ui-demo" id="uiDemo">
        <div class="q-top">
          <div class="q-label">QUESTION 04 / 10</div>
          <div class="q-title">Which image best fits the audience survey answer?</div>
        </div>
        <div class="cards">
          <div class="card"><div class="thumb"></div><div class="card-label">OPTION A</div></div>
          <div class="card"><div class="thumb"></div><div class="card-label">OPTION B</div></div>
          <div class="card"><div class="thumb"></div><div class="card-label">OPTION C</div></div>
          <div class="card"><div class="thumb"></div><div class="card-label">OPTION D</div></div>
          <div class="card"><div class="thumb"></div><div class="card-label">OPTION E</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <label>Intensity <input id="intensity" type="range" min="0.2" max="1.7" step="0.05" value="1"></label>
    <button id="toggleDemo">Toggle Q&A Demo</button>
    <button id="fullscreenBtn">Fullscreen</button>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const particleCanvas = document.getElementById('particleCanvas');
    const ctx = particleCanvas.getContext('2d');
    const intensity = document.getElementById('intensity');
    const fxRoot = document.getElementById('fxRoot');
    const uiDemo = document.getElementById('uiDemo');

    function sizeCanvas() {
      const rect = stage.getBoundingClientRect();
      particleCanvas.width = Math.max(1, Math.floor(rect.width * devicePixelRatio));
      particleCanvas.height = Math.max(1, Math.floor(rect.height * devicePixelRatio));
      particleCanvas.style.width = rect.width + 'px';
      particleCanvas.style.height = rect.height + 'px';
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    const particles = Array.from({length: 34}, (_, i) => ({
      t: i / 34,
      speed: 0.0008 + Math.random() * 0.0008,
      size: 1.2 + Math.random() * 2.4,
      alpha: 0.15 + Math.random() * 0.35,
      offset: Math.random() * Math.PI * 2,
      hue: Math.random() > 0.5 ? 'gold' : 'magenta'
    }));

    function drawEllipseParticles(ms) {
      const rect = stage.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w * 0.505;
      const cy = h * 0.47;
      const rx = w * 0.245;
      const ry = h * 0.102;
      const now = ms || performance.now();
      const intens = parseFloat(intensity.value);

      particles.forEach((p, idx) => {
        const phase = (p.t + now * p.speed) % 1;
        const angle = phase * Math.PI * 2 + p.offset * 0.04;
        const x = cx + Math.cos(angle) * rx;
        const y = cy + Math.sin(angle) * ry;
        const tw = (Math.sin(angle - 0.2) + 1) / 2;
        const a = p.alpha * (0.45 + tw * 0.85) * intens;
        const r = p.size * (0.8 + tw * 0.6) * (0.9 + intens * 0.15);

        ctx.beginPath();
        ctx.fillStyle = p.hue === 'gold'
          ? `rgba(255, 198, 68, ${a})`
          : `rgba(245, 104, 255, ${a * 0.95})`;
        ctx.shadowBlur = 12 * intens;
        ctx.shadowColor = p.hue === 'gold' ? 'rgba(255,198,68,.75)' : 'rgba(245,104,255,.68)';
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }

    function animate(ms) {
      drawEllipseParticles(ms);
      requestAnimationFrame(animate);
    }

    intensity.addEventListener('input', () => {
      fxRoot.style.opacity = Math.min(1.35, parseFloat(intensity.value));
    });

    document.getElementById('toggleDemo').addEventListener('click', () => {
      uiDemo.classList.toggle('active');
    });

    document.getElementById('fullscreenBtn').addEventListener('click', async () => {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    });

    window.addEventListener('resize', sizeCanvas);
    sizeCanvas();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
