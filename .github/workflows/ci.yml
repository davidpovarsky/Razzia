name: Diagnostic / 1ec tadazz-show

on:
  workflow_dispatch:
    inputs:
      diagnostic_commit:
        description: Exact reviewed diagnostic branch commit (40 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnostic-1ec-tadazz-show-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  tadazz_show_diagnostic:
    name: Diagnostic / tadazz-show / 1ec
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: tadazz-show
            config: playwright.tadazz-show.config.ts
            browsers: chromium webkit
            buildOrdinarySite: true
            remoteQa: "1"
    env:
      TADAZZ_REMOTE_QA: ${{ matrix.remoteQa }}
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/work/ci-e2e/${{ matrix.lane }}/playwright-report.json
      TADAZZ_SHOW_DIAGNOSTIC_DIR: ${{ github.workspace }}/work/ci-e2e/tadazz-show/diagnostic
      DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
    steps:
      - name: Checkout exact application 1ec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1ec7dc5c9549651f1618390a21f8db7efae4ea6f

      - name: Checkout separately reviewed diagnostic bundle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.diagnostic_commit }}
          path: diagnostic-source
          sparse-checkout: diagnostics/tadazz-show

      - name: Verify and install exactly two diagnostic QA files
        id: overlay
        shell: bash
        run: |
          test "$DIAGNOSTIC_COMMIT" = "$GITHUB_SHA"
          printf '%s  %s\n' '9f1caac346c1b70d4dcf0a2869a048f6d0aa609e4db30e9cda0ad786778ef239' 'diagnostic-source/diagnostics/tadazz-show/verify-overlay.CLOSED.py' | sha256sum --check --strict
          python3 diagnostic-source/diagnostics/tadazz-show/verify-overlay.CLOSED.py install --manifest "$GITHUB_WORKSPACE/diagnostic-source/diagnostics/tadazz-show/bundle-manifest.CLOSED.json" --manifest-sha256 c4151b0fbe021c2e460b9970505a5d0b2ad5b5852e34be77ca1276e97db2c068

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify exact dedicated discovery
        shell: bash
        run: |
          evidence="work/ci-e2e/${{ matrix.lane }}"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/revision.txt"
          python3 scripts/qa/ci-e2e-routing.py selectors "${{ matrix.lane }}" > "$evidence/selectors.txt"
          mapfile -t files < "$evidence/selectors.txt"
          pnpm test:e2e --config="${{ matrix.config }}" "${files[@]}" --list | tee "$evidence/list.txt"
          python3 scripts/qa/ci-e2e-routing.py verify-list "${{ matrix.lane }}" "$evidence/list.txt" > "$evidence/discovery.json"

      - name: Build ordinary frontend for preview servers
        if: matrix.buildOrdinarySite
        env:
          TADAZZ_SITE_ENABLED: "false"
        run: pnpm --filter @razzia/web exec vite build --config ../../extensions/site.vite.config.ts --configLoader runner

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @razzia/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browsers }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @razzia/e2e exec playwright install --with-deps ${{ matrix.browsers }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @razzia/e2e exec playwright install-deps ${{ matrix.browsers }}

      - name: Run exact dedicated cases with passive diagnostic capture
        id: run
        shell: bash
        env:
          DEBUG: pw:browser
        run: |
          python3 diagnostic-source/diagnostics/tadazz-show/process-capture.CLOSED.py --command-file "$GITHUB_WORKSPACE/diagnostic-source/diagnostics/tadazz-show/run-original-cases.sh" --evidence "$TADAZZ_SHOW_DIAGNOSTIC_DIR/process"

      - name: Verify exact actual results
        if: always() && steps.run.outcome != 'skipped'
        run: python3 scripts/qa/ci-e2e-routing.py verify-result "${{ matrix.lane }}" "$PLAYWRIGHT_JSON_OUTPUT_FILE" > "work/ci-e2e/${{ matrix.lane }}/result-verification.json"

      - name: Retain exact source and overlay readback
        if: always() && steps.overlay.outcome == 'success'
        shell: bash
        run: |
          python3 diagnostic-source/diagnostics/tadazz-show/verify-overlay.CLOSED.py verify-after --manifest "$GITHUB_WORKSPACE/diagnostic-source/diagnostics/tadazz-show/bundle-manifest.CLOSED.json" --manifest-sha256 c4151b0fbe021c2e460b9970505a5d0b2ad5b5852e34be77ca1276e97db2c068

      - name: Upload separate diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-tadazz-show-1ec-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/ci-e2e/${{ matrix.lane }}
            packages/e2e/test-results
            work/next-acceptance-results
            work/ui-fidelity-results
            work/tadazz-show-results
          retention-days: 7
