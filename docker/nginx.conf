server {
    listen 3000;

    root /app/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /branding/ {
        alias /app/config/branding/;
    }

    # Every media request is authorized by the app; no public tenant file alias.
    location /media/ {
        proxy_pass http://127.0.0.1:3001/api/media/raw/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
    location /__private_media/ {
        internal;
        alias /app/config/tenants/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "private, no-store";
    }
    location /__legacy_media/ {
        internal;
        alias /app/config/media/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "private, no-store";
    }

    location /api {
        client_max_body_size 101m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
