.tz-screen-inner {position:relative;width:100%;height:100%;z-index:1;}
.tz-screen-eyebrow {position:absolute;top:120px;left:0;right:0;text-align:center;font-size:26px;letter-spacing:.38em;font-weight:900;color:#d1b1ff;}
.tz-leader-title {position:absolute;top:160px;left:0;right:0;text-align:center;font-size:84px;letter-spacing:-.035em;color:#fff0de;text-shadow:0 0 25px #a947ff78; font-weight:950;}
.tz-leader-title span{color:#f0ff50;}
.tz-leader-underline {position:absolute;top:268px;left:36%;right:36%;height:4px;border-radius:50px;background:linear-gradient(90deg,transparent,#f4ff40,#ff8fdf,transparent);box-shadow:0 0 24px #efb7ff;}
.tz-leader-rows {position:absolute;left:270px;right:270px;top:337px;height:590px;display:flex;flex-direction:column;gap:12px;}
.tz-leader-row {height:85px;display:flex;align-items:center;gap:32px;padding:0 30px;border:1px solid #ad75ff88;border-radius:20px;background:linear-gradient(100deg,#3f1c6af0,#211345f5);box-shadow:inset 0 1px 0 #ffffff1c,0 9px 22px #08012255;will-change:transform,opacity;}
.tz-leader-row.champion {border-color:#ebff52d6;background:linear-gradient(100deg,#47316aed,#433248dc);box-shadow:0 0 19px #efff4e35;}
.tz-rank {display:grid;place-items:center;width:57px;height:57px;flex:none;border-radius:50%;background:#8d58dc66;color:#fff4e9;font-weight:950;font-size:30px;}
.tz-leader-row.champion .tz-rank {background:#eaff57;color:#200d4c;}
.tz-team-name {font-size:34px;font-weight:850;flex:1;}
.tz-team-score {font-size:38px;font-variant-numeric:tabular-nums;font-weight:950;color:#fff1d9;}
.tz-leader-row.champion .tz-team-score {color:#eaff57;}
.tz-win-logo {position:absolute;left:50%;top:220px;width:770px;transform:translateX(-50%);filter:drop-shadow(0 0 50px #cb6fff38);}
.tz-win-headline {position:absolute;top:680px;left:0;right:0;text-align:center;font-size:34px;letter-spacing:.24em;font-weight:900;color:#d7b7ff;}
.tz-win-name {position:absolute;top:740px;left:0;right:0;text-align:center;font-size:86px;font-weight:1000;color:#efff42;text-shadow:0 0 28px #eaff5755;}
.tz-win-score {position:absolute;top:859px;left:0;right:0;text-align:center;font-size:35px;font-weight:800;color:#fff3e0;}
.tz-intro-logo {position:absolute;width:1100px;left:410px;top:360px;filter:drop-shadow(0 0 50px #c53bff77);transform-origin:55% 56%; }
.tz-intro-caption {position:absolute;bottom:163px;left:0;right:0;text-align:center;letter-spacing:.32em;font-size:27px;font-weight:900;color:#fff0cc;}
.tz-shock {position:absolute;left:50%;top:50%;width:900px;height:380px;border:8px solid #f9f49a;border-radius:50%;transform:translate(-50%,-50%) scale(.24);opacity:0;box-shadow:0 0 52px #fff6ad;pointer-events:none;}
.tz-wipe {position:absolute;inset:0;z-index:30;display:none;pointer-events:none;overflow:hidden;}
.tz-wipe.is-visible {display:block;}
.tz-wipe-piece {position:absolute;top:-15%;width:68%;height:130%;filter:drop-shadow(0 0 30px #ab66fe);will-change:transform;}
.tz-wipe-piece.blue {left:-10%; background:linear-gradient(125deg,#0460e0,#39caff 43%,#6b48f7 68%,#1a0b64);clip-path:polygon(0 0,100% 0,72% 27%,100% 50%,72% 78%,100% 100%,0 100%);transform:translateX(-130%);}
.tz-wipe-piece.citron {right:-10%;background:linear-gradient(230deg,#edff26,#f6fc47 39%,#f8b84f 68%,#6f1db7);clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 76%,0 49%,28% 23%);transform:translateX(130%);}
.tz-wipe-flash {position:absolute;inset:0;background:#fff5cd;opacity:0;}
.tz-wipe-word {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-4deg) scale(.8);font-size:140px;font-weight:1000;letter-spacing:-.06em;opacity:0;color:#fff9db;text-shadow:0 7px #160947,0 0 45px #e4baff;}
.tz-collision-bloom {position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff3c5,rgba(230,110,255,.45) 13%,transparent 50%);opacity:0;}
.tz-confetti {position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.tz-confetti-bit {position:absolute;top:-90px;width:14px;height:24px;background:#f5e75e;border-radius:2px;opacity:0;}
@media (prefers-reduced-motion:reduce) { .tz-ambient * {animation:none !important;} }
/* Demo controls intentionally outside the projected 16:9 stage */
.tz-demo-controls {position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;gap:8px;padding:12px 18px;overflow-x:auto;white-space:nowrap;background:#090619;border-top:1px solid #6e38ab7c;color:#e8d8fa;font:700 14px system-ui,sans-serif;scrollbar-width:thin;}
.tz-demo-controls button {padding:12px 15px;border-radius:10px;border:1px solid #8855cf;background:#26104a;color:white;font-weight:800;cursor:pointer;box-shadow:0 2px 8px #0004;flex:none;}
.tz-demo-controls button:hover {background:#4b1b81;border-color:#f0c8ff;}
.tz-demo-controls button:focus-visible {outline:3px solid #efff51;outline-offset:2px;}
.tz-demo-controls button.accent {color:#251044;background:#e5f84c;border-color:#f2ff9a;}
.tz-demo-controls .tz-control-sep {width:1px;height:39px;background:#7c4db1;flex:none;margin:0 4px;}
.tz-demo-controls .tz-helper {font-size:12px;color:#b4a3d1;flex:none;white-space:normal;max-width:205px;}
.tz-demo-controls label {font-size:13px;color:#cdbcea;display:flex;align-items:center;gap:4px;}
/* When the stage viewport enters browser fullscreen, reclaim the toolbar space. */
#viewport:fullscreen { position:fixed; inset:0; width:100vw; height:100vh; }

.tz-card.very-long .tz-card-label {font-size:22px;white-space:normal;line-height:1.08;padding:0 6px;text-wrap:balance;}

  </style>

  function el(tag, cls, txt) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (txt != null) node.textContent = txt;
    return node;
  }
  function clamp(n,min,max) { return Math.min(max,Math.max(min,n)); }
  function ms(v) { return Math.max(0,Number(v)||0); }
  function wait(t) { return new Promise(r => setTimeout(r,t)); }
  function updateText(node,text) {node.textContent = String(text);}

  class TadazzMotion {
    constructor(stage, opts={}) {
      if (!stage) throw new Error('TadazzMotion: a stage element is required');
      this.stage=stage;
      this.opts=opts;
      this.reducedMotion=!!opts.reducedMotion;
      this.active=new Set();
      this.tweens=new Set();
      this.fastForwardSeq=-1;
      this.sequence=0;
      this.currentQuestion=null;
      this.teamScores=new Map(TEAMS.map(t=>[t.id,t.score]));
      this.lastTeamRows=new Map();
      this.timerInterval=null;
      this.timerEnd=0;
      this.votingOpen=false;
      this.mode='idle';
      this.counts=[];
      this.cards=[];
      this._build();
      this._fit();
      this._resize=()=>this._fit();
      window.addEventListener('resize',this._resize);
    }

    _build() {
      this.stage.innerHTML='';
      this.stage.classList.add('tz-stage');
      const background=el('div','tz-backdrop');
      const ambient=el('div','tz-ambient');
      ambient.innerHTML='<div class="beam a"></div><div class="beam b"></div><div class="beam c"></div><div class="edge-blue"></div><div class="edge-citron"></div><div class="floorline"></div>';
      this.ambient=ambient;
      this.stage.append(background,ambient);
      const topline=el('div','tz-topline');
      const brand=el('div','tz-micro-brand');brand.innerHTML='TADA<span>ZZ!</span>';
      this.round=el('div','tz-round','ROUND 01 · QUESTION 04 / 10');

    _cue(name) {

      if (typeof this.opts.onCue==='function') {
        try { this.opts.onCue(name); } catch(e) { console.warn('Tadazz audio cue failed',e); }

      if(!this.currentQuestion)throw new Error('Show a question before revealing survey results');

      const total=values.reduce((a,b)=>a+b,0);

  <script>
'use strict';
const stage=document.getElementById('tadazz-stage');
const show=new TadazzMotion(stage);
window.tadazzShow=show;
let demoRound=1;
let updated=false;
const teams=TadazzMotion.sampleTeams.map(t=>({...t}));
const newScores={ 'team-blue':920,'brainwaves':805,'clever-crew':790,'gold':745,'zoomers':725,'quiz-masters':705};
const byId=id=>document.getElementById(id);
const newQuestion=()=>({
 question: demoRound===1 ? 'Pick a secondary character.' : 'Which character would you choose?',
 round:demoRound,number:demoRound===1?4:5,totalQuestions:10,
 options:TadazzMotion.sampleQuestion.options
});

function safe(fn){return async()=>{try{await fn();}catch(err){console.error('Tadazz animation error:',err);alert(err.message)}};}
byId('intro').onclick=safe(()=>show.showIntro());
byId('question').onclick=safe(()=>show.showQuestion(newQuestion()));
byId('vote').onclick=safe(()=>show.openVoting(30));
byId('lock').onclick=safe(()=>show.lockVoting());
byId('reveal').onclick=safe(()=>show.revealResults([24,12,42,14,8]));
byId('leader').onclick=safe(async()=>{updated=false;await show.showLeaderboard(teams);});
byId('rank').onclick=safe(async()=>{
 const values=updated?teams:teams.map(t=>({...t,score:newScores[t.id]}));
 await show.updateLeaderboard(values);
 updated=!updated;
});
byId('next').onclick=safe(async()=>{demoRound=demoRound===1?2:1; await show.nextQuestion(newQuestion());});
byId('winner').onclick=safe(()=>show.showFinale({name:updated?'TEAM BLUE':'THE BRAINWAVES',score:updated?920:735}));
byId('skip').onclick=()=>show.finishAnimations();
byId('reduced').onclick=()=>{
 show.setReducedMotion(!show.reducedMotion);
 byId('reduced').textContent='Reduced motion: '+(show.reducedMotion?'on':'off');
};
byId('fullscreen').onclick=async()=>{
 const viewport=document.getElementById('viewport');
 if(document.fullscreenElement){await document.exitFullscreen();}
 else{await viewport.requestFullscreen();}
};
// No auto-started voting or hidden selects. Initially show a neutral question screen.
show.showQuestion(newQuestion());

  </script>
